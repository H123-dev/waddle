services:
  db:
    image: postgres:17
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "waddle" ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: waddle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/waddle
      DB_USERNAME: postgres
      DB_PASSWORD: secret

volumes:
  postgres_data: